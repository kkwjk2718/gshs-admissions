<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f4f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="2027학년도 수시모집 전형일정. 대학 24곳의 원서 접수·서류 제출·면접·합격 발표·합격자 등록 일정을 마감이 가까운 순서로 확인하세요."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="2027 수시 일정 | GSHS.app" />
    <meta
      property="og:description"
      content="대학 24곳의 원서 접수·서류 제출·면접·합격 발표 일정을 마감이 가까운 순서로."
    />
    <meta property="og:locale" content="ko_KR" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>2027 수시 일정 | GSHS.app</title>
    <script>
      // 첫 페인트 전에 테마를 정한다. 이게 없으면 다크 사용자에게 흰 화면이 한 번 번쩍인다.
      (function () {
        try {
          var stored = localStorage.getItem("gshs-admissions:theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
